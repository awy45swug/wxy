<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🐟 摸鱼计时排行榜</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>

  <header class="topbar">
    <div class="title-wrap">
      <h1>🐟 摸鱼计时排行榜 🐟</h1>
      <p class="subtitle">带薪摸鱼，从这一刻开始（老板勿入）</p>
    </div>
    <button id="darkToggle" class="ghost-btn" title="切换暗黑模式">🌙</button>
    <button id="switchUser" class="ghost-btn">🔄 切换用户</button>
  </header>

  <div id="tips" class="tips">💡 摸鱼有益身心健康（假的）</div>

  <main class="layout">
    <!-- 计时器卡片 -->
    <section class="card timer-card">
      <div class="me-head">
        <span id="meAvatar" class="me-avatar">🐟</span>
        <div>
          <div id="meName" class="me-name">还没进场</div>
          <div id="meTitle" class="me-title">摸鱼萌新</div>
        </div>
        <span id="meLive" class="live-badge hidden">🌊 摸鱼中</span>
      </div>

      <div class="big-timer" id="bigTimer">00:00:00</div>
      <div class="session-label" id="sessionLabel">还没开始摸鱼哦～</div>

      <div class="timer-btns">
        <button id="btnStart" class="btn btn-start">▶ 开始摸鱼</button>
        <button id="btnPause" class="btn btn-pause" disabled>⏸ 暂停</button>
        <button id="btnStop" class="btn btn-stop" disabled>⏹ 结束</button>
      </div>

      <div class="my-stats">
        <div class="stat">
          <span class="stat-label">今日摸鱼</span>
          <b id="myToday" class="stat-val">00:00:00</b>
        </div>
        <div class="stat">
          <span class="stat-label">总摸鱼</span>
          <b id="myTotal" class="stat-val">00:00:00</b>
        </div>
      </div>
    </section>

    <!-- 排行榜卡片 -->
    <section class="card board-card">
      <h2 class="board-title">🏆 摸鱼英雄榜</h2>
      <div class="view-tabs">
        <button class="vtab active" data-view="total">总榜</button>
        <button class="vtab" data-view="today">今日</button>
        <button class="vtab" data-view="week">本周</button>
        <button class="vtab" data-view="month">本月</button>
      </div>
      <div id="leaderboard" class="leaderboard">
        <div class="empty-tip">还没有人摸鱼，快来当第一名！</div>
      </div>
    </section>
  </main>

  <!-- 底部区块：聊天室 + 电子木鱼 + 小红书爆款 -->
  <div class="bottom-cards">
    <!-- 在线聊天室 -->
    <section class="card chat-card">
      <h2 class="board-title">💬 摸鱼茶水间 <span class="chat-online" id="chatOnline">· 在线</span></h2>
      <div id="chatList" class="chat-list"></div>
      <div class="chat-input-row">
        <input id="chatInput" class="chat-input" maxlength="200" placeholder="说点啥…（老板听不到）" />
        <button id="chatSend" class="btn btn-start chat-send">发送</button>
      </div>
    </section>

    <!-- 电子木鱼 + 功德榜 -->
    <section class="card merit-card">
      <h2 class="board-title">🔔 电子木鱼 <span class="merit-mine">我的功德 +<b id="myMerit">0</b></span></h2>
      <div class="woodfish-wrap">
        <button id="woodfish" class="woodfish" aria-label="敲木鱼积功德">
          <svg viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg" class="woodfish-svg">
            <defs>
              <radialGradient id="woodG" cx="38%" cy="32%" r="80%">
                <stop offset="0%" stop-color="#d99a5b"/>
                <stop offset="52%" stop-color="#b06f33"/>
                <stop offset="100%" stop-color="#7c4519"/>
              </radialGradient>
            </defs>
            <ellipse cx="60" cy="66" rx="50" ry="42" fill="#5a3210" opacity="0.22"/>
            <path d="M60 20 C94 20 110 44 110 68 C110 92 88 104 60 104 C30 104 10 90 10 64 C10 40 28 20 60 20 Z" fill="url(#woodG)" stroke="#6b3c14" stroke-width="3"/>
            <path d="M32 30 Q60 14 88 30 Q76 23 60 23 Q44 23 32 30 Z" fill="#3e2208"/>
            <ellipse cx="62" cy="70" rx="18" ry="13" fill="#5a3210" opacity="0.5"/>
            <path d="M22 62 Q40 52 58 56" stroke="#8a5523" stroke-width="2.5" fill="none" opacity="0.6"/>
            <path d="M70 90 Q88 82 100 86" stroke="#8a5523" stroke-width="2.5" fill="none" opacity="0.5"/>
            <circle cx="60" cy="16" r="4" fill="#5a3210"/>
          </svg>
        </button>
      </div>
      <div class="merit-tip">老板骂我我敲鱼，烦恼随功德去 🔔</div>
      <h3 class="board-subtitle">📿 功德榜</h3>
      <div id="meritBoard" class="merit-board"></div>
    </section>

    <!-- 小红书每日爆款 Top30 -->
    <section class="card xhs-card">
      <h2 class="board-title">🔥 小红书今日爆款 TOP30</h2>
      <div class="wall-tip" id="xhsTip">实时抓取每日最热，点一下去小红书搜同款 🔍</div>
      <div id="xhsList" class="xhs-list"></div>
    </section>
  </div>

  <!-- 加入 / 切换用户弹窗 -->
  <div id="joinModal" class="modal-mask">
    <div class="modal-box">
      <h2>🐟 加入摸鱼场</h2>
      <p class="modal-sub">起个名字，挑个头像，开始你的表演</p>
      <input id="nickInput" class="nick-input" maxlength="12" placeholder="给自己起个摸鱼昵称" />
      <div class="avatar-row" id="avatarRow"></div>
      <label class="upload-btn">
        📷 上传头像
        <input type="file" id="avatarUpload" accept="image/*" hidden />
      </label>
      <button id="joinBtn" class="btn btn-start join-btn">进入摸鱼场 🚪</button>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
