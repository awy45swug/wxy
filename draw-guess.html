<style>
  :root{
    --mint:#86D1A8;
    --mint-soft:#EAF7F0;
    --bg:#F6F6F8;
    --card:#FFFFFF;
    --ink:#1C1C1E;
    --ink-2:#8E8E93;
    --line:#ECECEF;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.04);
    --shadow-soft:0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",
      "Microsoft YaHei",sans-serif;
    font-weight:400;
    letter-spacing:.2px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .app{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));
    position:relative;
  }

  /* ---------- 通用卡片 ---------- */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- 房间页 ---------- */
  #room{padding-top:64px;}
  .brand{text-align:center;margin-bottom:36px;}
  .brand .logo{
    width:64px;height:64px;border-radius:18px;margin:0 auto 16px;
    background:linear-gradient(160deg,#9FE0BF,var(--mint));
    box-shadow:0 8px 22px rgba(134,209,168,.35);
    display:flex;align-items:center;justify-content:center;font-size:32px;
  }
  .brand h1{font-size:22px;font-weight:600;margin:0 0 6px;letter-spacing:.5px;}
  .brand p{font-size:13px;color:var(--ink-2);margin:0;}

  .room-card{padding:20px;margin-bottom:14px;}
  .room-row{display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;border-bottom:1px solid var(--line);}
  .room-row:last-child{border-bottom:none;}
  .room-row .k{font-size:14px;color:var(--ink-2);}
  .room-row .v{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;}
  .copy-code{color:var(--mint);font-weight:600;letter-spacing:1px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--mint-soft);
    display:flex;align-items:center;justify-content:center;font-size:16px;}
  .players{display:flex;flex-direction:column;gap:2px;}
  .player-line{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;}
  .player-line .nm{font-weight:500;}
  .player-line .tag{margin-left:auto;font-size:12px;color:var(--ink-2);}

  .btn{
    width:100%;border:none;border-radius:var(--radius);
    background:var(--mint);color:#fff;font-size:16px;font-weight:600;
    padding:15px 0;margin-top:18px;cursor:pointer;
    box-shadow:0 8px 18px rgba(134,209,168,.32);
    transition:transform .08s ease,opacity .2s ease;
    font-family:inherit;
  }
  .btn:active{transform:scale(.985);}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-soft);
    border:1px solid var(--line);}

  /* ---------- 游戏页 ---------- */
  #game{display:none;padding-top:14px;}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .back{width:34px;height:34px;border-radius:10px;background:#fff;border:none;
    box-shadow:var(--shadow-soft);font-size:18px;cursor:pointer;color:var(--ink);}
  .round-info{flex:1;}
  .round-info .t{font-size:15px;font-weight:600;}
  .round-info .s{font-size:12px;color:var(--ink-2);margin-top:2px;}

  /* 题目遮罩 */
  .wordmask{
    background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;
  }
  .wordmask .lbl{font-size:12px;color:var(--ink-2);}
  .wordmask .word{font-size:22px;font-weight:700;letter-spacing:2px;margin-top:4px;}
  .wordmask .word.hidden{color:var(--ink-2);font-weight:600;letter-spacing:6px;}
  .wordmask .cat{font-size:11px;color:var(--mint);background:var(--mint-soft);
    padding:4px 9px;border-radius:8px;font-weight:600;white-space:nowrap;}

  /* 画布 */
  .canvas-card{padding:10px;margin-bottom:12px;}
  #board{width:100%;height:300px;display:block;border-radius:8px;
    background:#FCFCFD;touch-action:none;cursor:crosshair;}

  /* 工具条 */
  .tools{display:flex;align-items:center;gap:10px;padding:10px 6px 4px;flex-wrap:wrap;}
  .swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .1s;}
  .swatch.active{transform:scale(1.18);box-shadow:0 0 0 2px var(--mint);}
  .tool-btn{border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:7px 12px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit;}
  .tool-btn:active{background:var(--mint-soft);}
  .brush{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--ink-2);}
  .brush input{accent-color:var(--mint);}

  /* 猜词 / 角色 */
  .rolebar{display:flex;gap:8px;margin-bottom:10px;}
  .rolebar .seg{flex:1;text-align:center;padding:10px 0;border-radius:10px;
    background:#fff;box-shadow:var(--shadow-soft);font-size:13px;font-weight:500;
    color:var(--ink-2);cursor:pointer;border:1px solid transparent;}
  .rolebar .seg.active{color:#fff;background:var(--mint);border-color:var(--mint);
    box-shadow:0 6px 14px rgba(134,209,168,.3);}

  .guess-row{display:flex;gap:10px;margin-bottom:12px;}
  .guess-row input{flex:1;border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;font-size:15px;font-family:inherit;background:#fff;outline:none;
    color:var(--ink);}
  .guess-row input:focus{border-color:var(--mint);}
  .guess-row button{border:none;border-radius:10px;background:var(--mint);color:#fff;
    padding:0 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .guess-hint{font-size:12px;color:var(--ink-2);text-align:center;margin-bottom:12px;}

  /* 侧边迷你积分榜（移动端做成顶部细条） */
  .score-mini{
    background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-soft);
    padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:14px;
    overflow:hidden;
  }
  .score-mini .ttl{font-size:12px;color:var(--ink-2);white-space:nowrap;}
  .score-mini .list{display:flex;gap:14px;flex:1;overflow-x:auto;}
  .score-mini .it{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;}
  .score-mini .it b{font-weight:700;color:var(--mint);}
  .score-mini .me{font-weight:600;}

  .full-score{display:none;}
  .footer-actions{display:flex;gap:10px;margin-top:4px;}
  .footer-actions .btn{margin-top:0;}

  /* 提示气泡 */
  .toast{
    position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-20px);
    background:rgba(28,28,30,.92);color:#fff;padding:11px 18px;border-radius:12px;
    font-size:13px;opacity:0;pointer-events:none;transition:all .28s ease;z-index:50;
    max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .score-pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);
    background:#fff;border-radius:16px;padding:22px 28px;box-shadow:var(--shadow);
    text-align:center;opacity:0;pointer-events:none;transition:all .3s ease;z-index:60;}
  .score-pop.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .score-pop .big{font-size:34px;}
  .score-pop .tx{font-size:15px;font-weight:600;margin-top:8px;}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 房间页 ============ -->
  <section id="room">
    <div class="brand">
      <div class="logo">🎨</div>
      <h1>你画我猜</h1>
      <p>WorkBuddy · 摸鱼小游戏</p>
    </div>

    <div class="card room-card">
      <div class="room-row">
        <span class="k">房间号</span>
        <span class="v"><span class="copy-code" id="roomCode">MY-7749</span></span>
      </div>
      <div class="room-row" style="display:block;">
        <span class="k" style="display:block;margin-bottom:8px;">在线玩家 · <span id="playerCount">4</span></span>
        <div class="players" id="roomPlayers"></div>
      </div>
    </div>

    <button class="btn" id="startBtn">开始游戏</button>
    <button class="btn ghost" id="ruleBtn">玩法说明</button>
  </section>

  <!-- ============ 游戏页 ============ -->
  <section id="game">
    <div class="topbar">
      <button class="back" id="backBtn">‹</button>
      <div class="round-info">
        <div class="t">第 <span id="roundNo">1</span> 轮</div>
        <div class="s">画师：<span id="drawerName">你</span></div>
      </div>
    </div>

    <!-- 题目遮罩 -->
    <div class="wordmask">
      <div>
        <div class="lbl">本轮题目</div>
        <div class="word" id="wordText">—</div>
      </div>
      <span class="cat" id="wordCat">职场</span>
    </div>

    <!-- 迷你积分榜 -->
    <div class="score-mini">
      <span class="ttl">积分</span>
      <div class="list" id="miniScore"></div>
    </div>

    <!-- 角色切换 -->
    <div class="rolebar">
      <div class="seg active" data-role="drawer">🎨 我是画师</div>
      <div class="seg" data-role="guesser">🔍 我是猜词</div>
    </div>

    <!-- 画布 -->
    <div class="canvas-card">
      <canvas id="board"></canvas>
      <div class="tools" id="tools">
        <div class="swatch active" data-c="#1C1C1E" style="background:#1C1C1E"></div>
        <div class="swatch" data-c="#86D1A8" style="background:#86D1A8"></div>
        <div class="swatch" data-c="#FF9F68" style="background:#FF9F68"></div>
        <div class="swatch" data-c="#5AA9F0" style="background:#5AA9F0"></div>
        <div class="swatch" data-c="#E5689A" style="background:#E5689A"></div>
        <div class="swatch" data-c="#C8A25B" style="background:#C8A25B"></div>
        <span class="tool-btn" id="eraser">橡皮</span>
        <span class="tool-btn" id="undo">撤销</span>
        <span class="tool-btn" id="clear">清空</span>
        <span class="brush">细<input type="range" id="brush" min="2" max="22" value="6"></span>
      </div>
    </div>

    <!-- 猜词区 -->
    <div id="guessArea">
      <div class="guess-row">
        <input id="guessInput" placeholder="输入你猜的词…" autocomplete="off" />
        <button id="guessSend">发送</button>
      </div>
      <div class="guess-hint" id="guessHint">你是画师，安静作画，等其他人猜 🤫</div>
    </div>

    <div class="footer-actions">
      <button class="btn ghost" id="skipBtn">换一题</button>
      <button class="btn" id="nextBtn">下一轮</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="score-pop" id="scorePop">
    <div class="big" id="popBig">✅</div>
    <div class="tx" id="popTx">猜对了 +10</div>
  </div>
</div>

let roundNo = 1;
let strokes = [];           // 撤销用
let drawing = false, lastX=0, lastY=0;
let color = "#1C1C1E", brush = 6, erasing = false;
let botTimer = null;

/* ===================== 元素 ===================== */
const $ = id => document.getElementById(id);
const roomEl=$("room"), gameEl=$("game");

/* ===================== 房间页 ===================== */
function renderRoom(){
  const list=$("roomPlayers");
  list.innerHTML = "";
  const all=[ME, ...BOTS];
  all.forEach(p=>{
    const div=document.createElement("div");
    div.className="player-line";
    const av = p.id==="me" ? "🐟" : (p.avatar||"🙂");
    div.innerHTML=`<span class="avatar">${av}</span><span class="nm">${p.name}</span>
      <span class="tag">${p.id==="me"?"（你）":""}</span>`;
    list.appendChild(div);
  });
  $("playerCount").textContent = all.length;
}

/* ===================== 游戏：出题（洗牌袋，抽过不放回） =====================
   修复提示词重复问题：
   - 把 2000 词的下标洗牌后放进"袋子"，每轮从袋子里取一个，取完才重洗；
   - 已用进度存 localStorage，刷新页面也不会重头重复；
   - 全部抽完一遍后才会开始第二轮循环。 */
const BAG_KEY = "dg_word_bag_v3";
let wordBag = [];
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function loadBag(){
  try{
    const saved = JSON.parse(localStorage.getItem(BAG_KEY)||"null");
    // 词库长度变了（更新过词库）就作废重建
    if(Array.isArray(saved) && saved.length>0 && saved.every(i=>i>=0&&i<WORD_BANK.length)){
      wordBag = saved;
      return;
    }
  }catch(e){}
  refillBag();
}
function refillBag(){
  wordBag = shuffle(WORD_BANK.map((_,i)=>i));
}
function saveBag(){
  try{ localStorage.setItem(BAG_KEY, JSON.stringify(wordBag)); }catch(e){}
}
function pickWord(){
  if(wordBag.length===0) loadBag();
  if(wordBag.length===0) refillBag();
  const idx = wordBag.pop();
  if(wordBag.length===0) refillBag();   // 袋子空了立刻重洗，备好下一轮
  saveBag();
  const item = WORD_BANK[idx];
  return {word:item.w, cat:item.diff, theme:item.theme};
}
function newRound(){
  current = pickWord();
  $("roundNo").textContent = roundNo;
  $("wordCat").textContent = CAT_LABEL[current.cat];
  applyRoleView();
}

/* ===================== 角色视图 ===================== */
function applyRoleView(){
  const isDrawer = role==="drawer";
  // 题目遮罩
  const wt=$("wordText");
  if(isDrawer){ wt.textContent=current.word; wt.classList.remove("hidden"); }
  else { wt.textContent="？ ？ ？"; wt.classList.add("hidden"); }
  // 画师名
  $("drawerName").textContent = isDrawer ? "你" : "同事A";
  // 画布可写？
  $("board").style.pointerEvents = isDrawer ? "auto" : "none";
  $("tools").style.opacity = isDrawer ? "1" : ".4";
  $("tools").style.pointerEvents = isDrawer ? "auto" : "none";
  // 猜词区
  const input=$("guessInput"), hint=$("guessHint");
  if(isDrawer){
    input.disabled=true; input.placeholder="你是画师，等别人猜 🤫";
    hint.textContent="你是画师，安静作画，等其他人猜 🤫";
  } else {
    input.disabled=false; input.placeholder="看画猜词，输入后发送…";
    hint.textContent="画师正在作画，你看不到题目，靠猜的 🔍";
  }
}

/* ===================== 画布（高 DPI） ===================== */
function setupCanvas(){
  const cv=$("board");
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  const rect = cv.getBoundingClientRect();
  cv.width = Math.round(rect.width*dpr);
  cv.height = Math.round(rect.height*dpr);
  const ctx = cv.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.lineCap="round"; ctx.lineJoin="round";
  cv._ctx = ctx;
}
function pos(e){
  const cv=$("board"); const r=cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function startDraw(e){
  if(role!=="drawer") return;
  drawing=true;
  const p=pos(e); lastX=p.x; lastY=p.y;
  const ctx=$("board")._ctx;
  strokes.push([]);
  e.preventDefault();
}
function moveDraw(e){
  if(!drawing||role!=="drawer") return;
  const p=pos(e); const ctx=$("board")._ctx;
  ctx.strokeStyle = erasing ? "#FCFCFD" : color;
  ctx.lineWidth = erasing ? brush*2.2 : brush;
  ctx.beginPath();
  ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y);
  ctx.stroke();
  strokes[strokes.length-1].push({x1:lastX,y1:lastY,x2:p.x,y2:p.y,c:erasing?"#FCFCFD":color,w:erasing?brush*2.2:brush});
  lastX=p.x; lastY=p.y;
  e.preventDefault();
}
function endDraw(e){ drawing=false; }
function clearBoard(){
  const cv=$("board"); const ctx=cv._ctx;
  ctx.clearRect(0,0,cv.width,cv.height); strokes=[];
}
function undo(){
  if(!strokes.length) return;
  strokes.pop();
  const cv=$("board"); const ctx=cv._ctx;
  ctx.clearRect(0,0,cv.width,cv.height);
  strokes.forEach(s=>s.forEach(seg=>{
    ctx.strokeStyle=seg.c; ctx.lineWidth=seg.w;
    ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(seg.x2,seg.y2); ctx.stroke();
  }));
}

/* ===================== 积分榜 ===================== */
function allPlayers(){ return [ME, ...BOTS]; }
function renderScores(){
  const mini=$("miniScore"); mini.innerHTML="";
  allPlayers().sort((a,b)=>b.score-a.score).forEach(p=>{
    const it=document.createElement("div");
    it.className="it"+(p.id==="me"?" me":"");
    it.innerHTML=`<span>${p.id==="me"?"🐟":p.avatar}</span><span>${p.name}</span><b>${p.score}</b>`;
    mini.appendChild(it);
  });
}

/* ===================== 猜词 ===================== */
function submitGuess(){
  if(role!=="guesser") return;
  const v=$("guessInput").value.trim();
  if(!v) return;
  if(v===current.word){
    ME.score+=10;
    showPop("✅","你猜对了！+10");
    renderScores();
    setTimeout(nextRound, 900);
  } else {
    toast(`❌ “${v}” 不对，再看看画～`);
  }
  $("guessInput").value="";
}

/* ===================== 机器人模拟（让榜“活”） ===================== */
function startBots(){
  stopBots();
  botTimer=setInterval(()=>{
    const b=BOTS[Math.floor(Math.random()*BOTS.length)];
    b.score += Math.floor(Math.random()*3)+1;
    renderScores();
    if(Math.random()<0.18){
      toast(`🤖 ${b.name} 猜了个词 +${Math.floor(Math.random()*3)+1}`);
    }
  }, 2200);
}
function stopBots(){ if(botTimer) clearInterval(botTimer); botTimer=null; }

/* ===================== 轮次切换 ===================== */
function nextRound(){
  roundNo++;
  newRound();
  clearBoard();
  renderScores();
}

/* ===================== 提示 ===================== */
let toastT=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800);
}
function showPop(big,tx){
  $("popBig").textContent=big; $("popTx").textContent=tx;
  const p=$("scorePop"); p.classList.add("show");
  setTimeout(()=>p.classList.remove("show"),1100);
}

/* ===================== 事件绑定 ===================== */
$("startBtn").onclick=()=>{
  roomEl.style.display="none"; gameEl.style.display="block";
  setupCanvas(); newRound(); renderScores(); startBots();
};
$("backBtn").onclick=()=>{
  gameEl.style.display="none"; roomEl.style.display="block";
  stopBots();
};
$("ruleBtn").onclick=()=>toast("画师看题作画，其他人猜词，先猜中得分 🎨");
$("nextBtn").onclick=nextRound;
$("skipBtn").onclick=()=>{ newRound(); clearBoard(); toast("已换一题"); };

document.querySelectorAll(".rolebar .seg").forEach(seg=>{
  seg.onclick=()=>{
    document.querySelectorAll(".rolebar .seg").forEach(s=>s.classList.remove("active"));
    seg.classList.add("active");
    role=seg.dataset.role; applyRoleView();
  };
});

$("guessSend").onclick=submitGuess;
$("guessInput").addEventListener("keydown",e=>{ if(e.key==="Enter") submitGuess(); });

document.querySelectorAll(".swatch").forEach(sw=>{
  sw.onclick=()=>{
    document.querySelectorAll(".swatch").forEach(s=>s.classList.remove("active"));
    sw.classList.add("active"); color=sw.dataset.c; erasing=false;
  };
});
$("eraser").onclick=()=>{ erasing=!erasing; toast(erasing?"橡皮开":"橡皮关"); };
$("undo").onclick=undo;
$("clear").onclick=clearBoard;
$("brush").oninput=e=>brush=+e.target.value;

const cv=$("board");
cv.addEventListener("mousedown",startDraw);
cv.addEventListener("mousemove",moveDraw);
window.addEventListener("mouseup",endDraw);
cv.addEventListener("touchstart",startDraw,{passive:false});
cv.addEventListener("touchmove",moveDraw,{passive:false});
cv.addEventListener("touchend",endDraw);

window.addEventListener("resize",()=>{ if(gameEl.style.display==="block"){ setupCanvas(); undo(); } });

/* 初始化 */
renderRoom();
</script>
</body>
</html>
